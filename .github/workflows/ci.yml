name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: 린트·타입·테스트·빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # 빌드 검증용 더미 값. 실제 값은 Vercel 환경변수에만 둔다.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  boundaries:
    name: A/B 영역 경계·마이그레이션 규칙
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-boundaries.mjs
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}

  db:
    name: 마이그레이션 적용 검증 (로컬 Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 빈 DB에 모든 마이그레이션 + seed.sql 을 처음부터 적용해 본다. SQL 오류가 있으면 여기서 실패.
      - run: npx supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npx supabase db lint --local --level error --fail-on error
      - run: npx supabase stop --no-backup
        if: always()
