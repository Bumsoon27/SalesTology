name: CI

# PR 에서만 돈다 (main 은 보호 규칙상 이 검사를 통과한 PR 로만 바뀐다).
# 필수 검사라 문서 PR 에서도 돌아야 한다 (건너뛰면 머지가 막힌다). DB 검증은 db-check.yml
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 공개 저장소: 워크플로 토큰은 읽기만
permissions:
  contents: read

jobs:
  app:
    name: 린트·타입·테스트·빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # 빌드 검증용 더미 값. 실제 값은 Vercel 환경변수에만 둔다.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  boundaries:
    name: A/B 영역 경계·마이그레이션 규칙
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-boundaries.mjs
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
