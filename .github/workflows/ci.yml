name: CI

# Actions 사용량 절약 (무료 2,000분/월): PR 에서만 돈다. main 에는 PR 에서 검사한 것만 합쳐진다.
# 문서만 바뀐 PR 은 건너뛴다. DB 검증은 db-check.yml (마이그레이션이 바뀐 PR 에서만)
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: 린트·타입·테스트·빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # 빌드 검증용 더미 값. 실제 값은 Vercel 환경변수에만 둔다.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  boundaries:
    name: A/B 영역 경계·마이그레이션 규칙
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-boundaries.mjs
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
