name: DB 검증

# 마이그레이션·seed 가 바뀐 PR 에서만 돈다 (로컬 Supabase 를 띄우느라 3~5분 걸린다)
on:
  pull_request:
    paths: ["supabase/**", "scripts/e2e-db.mjs"]

concurrency:
  group: db-check-${{ github.ref }}
  cancel-in-progress: true

# 공개 저장소: 워크플로 토큰은 읽기만
permissions:
  contents: read

jobs:
  db:
    name: 마이그레이션 적용 검증 (로컬 Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 빈 DB에 모든 마이그레이션 + seed.sql 을 처음부터 적용해 본다. SQL 오류가 있으면 여기서 실패.
      # 권한(RLS)·저장소 통합 검사에 필요한 auth·postgrest·storage·kong 은 띄운다
      - run: npx supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npx supabase db lint --local --level error --fail-on error
      # 실제 사용자 토큰으로 RLS·버킷 규칙(첨부 파일·경쟁사·목표)을 확인 — 일회용 사용자, 로컬 전용
      - name: 권한·저장소 통합 검사
        run: |
          eval "$(npx supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_KEY="$SERVICE_ROLE_KEY" node scripts/e2e-db.mjs
      - run: npx supabase stop --no-backup
        if: always()
