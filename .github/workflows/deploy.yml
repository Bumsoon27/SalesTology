name: 배포 (Vercel)

# Vercel Hobby 는 팀원이 아닌 사람(B)이 작성한 커밋을 배포하지 않으므로,
# Git 연동 자동 배포 대신 SB 계정 토큰으로 Actions 에서 배포한다.
#   PR    → 미리보기 배포 + PR 댓글로 주소 안내
#   main  → 운영 배포
# 필요한 값: repo secret VERCEL_TOKEN (vercel.com/account/tokens 에서 발급)
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: team_nVqvKpsz0WWgaae5UWL3o2DK
  VERCEL_PROJECT_ID: prj_MNR8Gs08wXkUuE6OyBEtOakJfNLT

jobs:
  deploy:
    name: Vercel ${{ github.event_name == 'push' && '운영' || '미리보기' }} 배포
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 포크 PR 에는 비밀값이 없으므로 건너뛴다
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 설정 확인
        id: cfg
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN 이 없어 배포를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ready == 'true'
        run: npm i -g vercel@64.7.0
      - if: steps.cfg.outputs.ready == 'true'
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      - if: steps.cfg.outputs.ready == 'true'
        run: vercel build $([ "$TARGET" = production ] && echo --prod) --token="$VERCEL_TOKEN"
      - if: steps.cfg.outputs.ready == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt $([ "$TARGET" = production ] && echo --prod) --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 배포 완료: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: PR 에 미리보기 주소 남기기
        if: steps.cfg.outputs.ready == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- salestology-preview -->';
            const body = `${marker}\n🔭 **미리보기**: ${{ steps.deploy.outputs.url }}\n\n커밋 \`${context.sha.slice(0, 7)}\` · 상대방도 이 주소에서 바로 확인하고 댓글로 피드백해 주세요.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
